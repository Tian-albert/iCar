<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>图标选择器分栏修复对比</title>
<!--
  一次性对比页：验证「分栏气泡」修复。
  左 = 修复前的写法（无 height，被 stretch 拉伸，文字贴上沿）
  右 = 修复后的写法（56rpx 定高 + flex 居中）
  数值按 375px 宽换算：1rpx = 0.5px
-->
<style>
  :root{
    --card:#FFFFFF; --fill:#F2F3F5; --bg:#F5F6F8;
    --primary:#3B6FF6; --primary-light:#EEF3FE;
    --t1:#1F2430; --t2:#5A6272; --t3:#6B7486; --divider:#F0F1F4;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:#E9ECF2;display:flex;justify-content:center;gap:24px;
    padding:28px 16px 40px;align-items:flex-start;color:var(--t1);
  }
  .col{width:340px;}
  .col h2{font-size:13px;font-weight:600;margin-bottom:4px;}
  .col p{font-size:11.5px;color:var(--t2);line-height:1.6;margin-bottom:10px;}

  .panel{
    background:var(--card);border-radius:12px;padding:16px;
    box-shadow:0 8px 28px rgba(15,23,42,.14);
  }
  .title{text-align:center;font-size:16px;font-weight:600;margin-bottom:12px;}

  /* ---------- 修复前：无 height，被 stretch ---------- */
  .tabbar-broken{
    display:flex;
    white-space:nowrap;
    overflow-x:auto;
    /* scroll-view 的默认行盒较高，子项 stretch 后气泡被撑高 */
    min-height:32px;
    align-items:stretch;
  }
  .tabbar-broken .tab{
    flex-shrink:0;
    padding:6px 12px;
    margin-right:6px;
    border-radius:999px;
    background:var(--fill);
    color:var(--t2);
    font-size:12px;
  }
  .tabbar-broken .tab.on{background:var(--primary-light);color:var(--primary);font-weight:600;}

  /* ---------- 修复后：56rpx=28px 定高 + 居中 ---------- */
  .tabbar-fixed{
    display:flex;
    align-items:center;      /* 不拉伸 */
    height:32px;             /* 64rpx */
    white-space:nowrap;
    overflow-x:auto;
  }
  .tabbar-fixed .tab{
    flex:0 0 auto;
    display:flex;
    align-items:center;      /* 文字垂直居中 */
    justify-content:center;
    height:28px;             /* 56rpx */
    line-height:1;
    padding:0 12px;
    margin-right:6px;
    border-radius:999px;
    background:var(--fill);
    color:var(--t2);
    font-size:12px;
  }
  .tabbar-fixed .tab.on{background:var(--primary-light);color:var(--primary);font-weight:600;}

  .grid{display:flex;flex-wrap:wrap;margin-top:10px;}
  .item{
    width:44px;height:44px;display:flex;align-items:center;justify-content:center;
    font-size:24px;border-radius:8px;margin:4px;background:var(--bg);
  }
  .custom{
    margin-top:10px;text-align:center;padding:10px 0 4px;font-size:14px;
    color:var(--primary);border-top:1px solid var(--divider);
  }
  .hint{text-align:center;font-size:11px;color:var(--t3);}
</style>
</head>
<body>

<div class="col">
  <h2>修复前</h2>
  <p>无 height，作为 flex 子项被 stretch 撑高，文字贴在气泡上沿。</p>
  <div class="panel">
    <div class="title">选择图标</div>
    <div class="tabbar-broken">
      <div class="tab on">加油充电</div>
      <div class="tab">洗美维修</div>
      <div class="tab">通行规费</div>
      <div class="tab">车型车色</div>
      <div class="tab">其他</div>
    </div>
    <div class="grid">
      <div class="item">🛢️</div><div class="item">⛽</div><div class="item">🔋</div>
      <div class="item">⚡</div><div class="item">🔌</div><div class="item">🪫</div>
    </div>
    <div class="custom">＋ 自定义图标（上传图片）</div>
    <div class="hint">任意尺寸图片都会裁成正方形</div>
  </div>
</div>

<div class="col">
  <h2>修复后（定高 56rpx + 居中）</h2>
  <p>容器 64rpx 居中，chip 固定 28px 高、文字用 flex 垂直居中，不再受行高影响。</p>
  <div class="panel">
    <div class="title">选择图标</div>
    <div class="tabbar-fixed">
      <div class="tab on">加油充电</div>
      <div class="tab">洗美维修</div>
      <div class="tab">通行规费</div>
      <div class="tab">车型车色</div>
      <div class="tab">其他</div>
    </div>
    <div class="grid">
      <div class="item">🛢️</div><div class="item">⛽</div><div class="item">🔋</div>
      <div class="item">⚡</div><div class="item">🔌</div><div class="item">🪫</div>
    </div>
    <div class="custom">＋ 自定义图标（上传图片）</div>
    <div class="hint">任意尺寸图片都会裁成正方形</div>
  </div>
</div>

</body>
</html>
